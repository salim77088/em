name: Auto-Fix Build Errors

on:
  workflow_run:
    workflows: ["Build NEXUS Engine"]
    types:
      - completed

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  autofix:
    name: Detect & Fix Build Errors
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download failure logs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const runId = context.payload.workflow_run.id;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: runId
            });
            for (const art of artifacts.data.artifacts) {
              if (art.name.startsWith('failure-logs-')) {
                console.log(`Downloading ${art.name}`);
                const zip = await github.rest.actions.downloadArtifact({
                  owner, repo, artifact_id: art.id, archive_format: 'zip'
                });
                const dir = `./logs-${art.name}`;
                fs.mkdirSync(dir, { recursive: true });
                fs.writeFileSync(`${dir}.zip`, Buffer.from(zip.data));
              }
            }

      - name: Extract logs
        run: |
          mkdir -p logs
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z" -d "logs/${z%.zip}" || true
            fi
          done
          ls -la logs/ || true

      - name: Run autofix script
        id: autofix
        run: |
          python3 tools/autofix.py --logs-dir logs --repo . --apply
          if [ -f .autofix-applied ]; then
            echo "applied=true" >> $GITHUB_OUTPUT
            cat .autofix-summary.txt || true
          else
            echo "applied=false" >> $GITHUB_OUTPUT
            echo "No fixable errors found."
          fi

      - name: Commit fixes
        if: steps.autofix.outputs.applied == 'true'
        run: |
          git config user.email "nexus-autofix@users.noreply.github.com"
          git config user.name "NEXUS AutoFix"
          git add -A
          git commit -m "fix(ci): auto-fix build errors

          $(cat .autofix-summary.txt 2>/dev/null || echo 'Auto-applied fixes')

          Generated by autofix.py on $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          " || echo "Nothing to commit"

      - name: Push to repo
        if: steps.autofix.outputs.applied == 'true'
        run: |
          git push origin HEAD:${{ github.event.repository.default_branch }}
          echo "Pushed fixes to ${{ github.event.repository.default_branch }}"

      - name: Trigger rebuild
        if: steps.autofix.outputs.applied == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: context.payload.repository.default_branch
            });
            console.log('Triggered rebuild');
