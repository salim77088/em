name: Build NEXUS Engine

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: nexus-linux
          - os: windows-2022
            artifact: nexus-windows
          - os: macos-13
            artifact: nexus-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake ninja-build git pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libdbus-1-dev libibus-1.0-dev \
            libasound2-dev libpulse-dev libudev-dev libjack-dev

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          xcodebuild -version || true

      - name: Cache CMake deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ matrix.os }}-cmake-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ matrix.os }}-cmake-

      - name: Print environment info
        shell: bash
        run: |
          echo "=== OS Info ==="
          uname -a || ver
          echo "=== Compiler Info ==="
          cmake --version
          echo "=== Disk Space ==="
          df -h || true

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0077=NEW

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0077=NEW

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --build build --config Release --parallel 4

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4

      - name: List build output
        shell: bash
        run: |
          ls -la build/ 2>/dev/null
          echo "---"
          ls -la build/Release/ 2>/dev/null || true

      - name: Collect failure logs
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f build/CMakeCache.txt ]; then cp build/CMakeCache.txt artifacts/; fi
          if [ -f build/CMakeFiles/CMakeOutput.log ]; then cp build/CMakeFiles/CMakeOutput.log artifacts/; fi
          if [ -f build/CMakeFiles/CMakeError.log ]; then cp build/CMakeFiles/CMakeError.log artifacts/; fi
          ls -la artifacts/ || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ matrix.artifact }}
          path: artifacts/
          retention-days: 30

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.artifact }}
          path: |
            build/nexus*
            build/Release/nexus*
            build/*.exe
            build/*.dll
            build/*.so
            build/*.dylib
          retention-days: 14
          if-no-files-found: warn

  notify:
    name: Build Status
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Summary
        shell: bash
        run: |
          echo "## NEXUS Engine Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build result: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
