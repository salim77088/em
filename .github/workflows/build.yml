name: Build NEXUS Engine

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel previous runs when a new commit is pushed
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360  # 6 hours max

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: nexus-linux
            shell: bash
          - os: windows-2022
            artifact: nexus-windows
            shell: pwsh
          - os: macos-13
            artifact: nexus-macos
            shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up build environment
        uses: ./.github/actions/setup-env
        with:
          os: ${{ matrix.os }}

      - name: Configure CMake
        shell: ${{ matrix.shell }}
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0077=NEW

      - name: Build
        shell: ${{ matrix.shell }}
        run: |
          cmake --build build --config Release --parallel 4

      - name: Test executable
        shell: ${{ matrix.shell }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ls -la build/Release/ 2>/dev/null || ls -la build/
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ls -la build/
          else
            ls -la build/
          fi
        env:
          RUNNER_OS: ${{ runner.os }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-${{ matrix.artifact }}
          path: |
            build/
            !build/_deps/
            !build/CMakeFiles/
            build_logs.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Collect build logs
        if: failure()
        shell: ${{ matrix.shell }}
        run: |
          mkdir -p artifacts
          # Save CMake output, build logs, and any error files
          if [ -f build/CMakeCache.txt ]; then cp build/CMakeCache.txt artifacts/; fi
          if [ -f build/CMakeFiles/CMakeOutput.log ]; then cp build/CMakeFiles/CMakeOutput.log artifacts/; fi
          if [ -f build/CMakeFiles/CMakeError.log ]; then cp build/CMakeFiles/CMakeError.log artifacts/; fi
          ls -la artifacts/ || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ matrix.artifact }}
          path: artifacts/
          retention-days: 30

  notify:
    name: Build Status
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## NEXUS Engine Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux    | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows  | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS    | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
